<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

  <main class="card">
    <!-- Painel esquerdo: formulário -->
    <section class="panel panel-form">
      <form method="post" action="{{ url_for('login') }}" class="login-form">
        <h2>Login</h2>
        <input type="text" name="username" placeholder="Nome" autocomplete="username" required>
        <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>

        <button type="submit">Continue</button>

      </form>
    </section>

    <!-- Painel direito: boas-vindas -->
    <section class="panel panel-welcome">
      <span class="bokeh b1"></span>
      <span class="bokeh b2"></span>
      <span class="bokeh b3"></span>
      <div class="welcome-text">
        <h2>Bem-Vindo Aluno</h2>
        <p>Como anda suas notas?</p>
      </div>
    </section>
  </main>
  {%with messages=get_flashed_messages(with_categories=true)%}
  {%if messages%}
  <div class="flashes">
    {%for category,message in messages%}
    <div class="{{ category }}">{{ message }}</div>
    {%endfor%}
  </div>
  {%endif%}
  {%endwith%}
<script>
  document.querySelectorAll('.flashes > div').forEach((flash) => {
    setTimeout(() => {
      flash.classList.add('fade-out');

      setTimeout(() => {
        flash.remove();

        const container = document.querySelector('.flashes');

        if (container && container.children.length === 0) {
          container.remove();
        }
      }, 500);

    }, 3000);
  });
</script>

</body>
</html>
